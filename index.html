    <!-- BỘ CHẶN "ASK NETLIFY BAR" PHIÊN BẢN V3 - KHÓA VÀ XÓA LIÊN TỤC -->
    <!-- ============================================================== -->
    <style>
      /* Khóa cứng và đẩy tất cả iframe/div lạ do Netlify tự sinh ra ra khỏi màn hình */
      body > iframe:not(#audio-player),
      body > div:not(.player-container):not(.search-box):not(.counter-dashboard),
      [class*="netlify" i], [id*="netlify" i],
      [class*="feedback" i], [id*="feedback" i],
      [class*="drawer" i], [id*="drawer" i] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
        position: absolute !important;
        top: -9999px !important;
        z-index: -9999 !important;
      }
    </style>

    <script>
      (function() {
        const destroyNetlify = () => {
          // 1. Chỉ giữ lại iframe phát nhạc của bạn, xóa sạch các iframe quảng cáo khác
          const iframes = document.querySelectorAll('iframe:not(#audio-player)');
          iframes.forEach(el => el.remove());

          // 2. Tìm và triệt hạ tận gốc các thẻ div/phần tử chứa từ khóa của hệ thống Netlify
          const elements = document.querySelectorAll('*');
          elements.forEach(el => {
            if (el && el.tagName !== 'BODY' && el.tagName !== 'HTML' && el.id !== 'audio-player') {
              const textId = String(el.id).toLowerCase();
              const textClass = String(el.className).toLowerCase();
              if (textId.includes('netlify') || textClass.includes('netlify') || 
                  textId.includes('drawer') || textClass.includes('drawer') ||
                  textId.includes('feedback') || textClass.includes('feedback')) {
                el.remove();
              }
            }
          });
        };

        // Quét mỗi 1 giây (quét 50ms làm máy nặng, bấm nút bị khựng)
        setInterval(destroyNetlify, 1000);
        document.addEventListener("DOMContentLoaded", destroyNetlify);
      })();
    </script>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        // Tìm cả thanh tìm kiếm và thanh bảng thống kê trên giao diện
        const searchBox = document.querySelector(".search-box.outer-search");
        const counterDashboard = document.getElementById("counter-dashboard");
        
        if (searchBox) {
            // ✔️ CHỈ GIỮ LẠI ĐÚNG 4 MÀU THEO YÊU CẦU CỦA BẠN (CÁC MÀU KHÁC ĐÃ BỎ HẾT)
            const colors = [
                "bg-random-orange", 
                "bg-random-blue", 
                "bg-random-purple"
            ];
            
            // Xúc xắc chọn một màu ngẫu nhiên chung cho cả 2 thanh
            const randomIndex = Math.floor(Math.random() * colors.length);
            const selectedColorClass = colors[randomIndex];
            
            // Bơm màu ngẫu nhiên trùng nhau vào thanh Tìm kiếm và thanh Thống kê
            searchBox.classList.add(selectedColorClass);
            if (counterDashboard) {
                counterDashboard.classList.add(selectedColorClass);
            }
        }
    });
    </script>
