<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minh Huệ - Chánh Kiến - Audio Player</title>
    
    <!-- === TĂNG TỐC ĐỘ: Kết nối sớm với máy chủ Google Drive giúp Iframe load nhạc nhanh hơn === -->
    <link rel="preconnect" href="https://google.com">
    <link rel="preconnect" href="https://google.com">
    
    <link rel="stylesheet" href="style.css">

    <!-- ============================================================== -->
    <!-- BỘ LỌC CHẶN VÀ ẨN THANH "ASK NETLIFY" TỰ ĐỘNG Ở ĐUÔI TRANG WEB -->
    <!-- ============================================================== -->
    <style>
      /* 1. Ép ẩn ngay lập tức bằng CSS độ ưu tiên cao nhất trước khi nó kịp render */
      #netlify-cms-root, 
      [id*="netlify"], 
      [class*="netlify"],
      iframe[id*="netlify"],
      iframe[src*="netlify"],
      div[class*="feedback"],
      div[id*="feedback"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
        position: absolute !important;
        left: -9999px !important;
      }
    </style>

    <script>
      /* 2. Dùng JavaScript thời gian thực xóa tận gốc phần tử Netlify ra khỏi DOM */
      document.addEventListener("DOMContentLoaded", function() {
        const killNetlify = () => {
          // Truy quét tất cả các phần tử nghi vấn có liên quan đến hệ thống Netlify Badge
          const elements = document.querySelectorAll('[id*="netlify"], [class*="netlify"], iframe');
          elements.forEach(el => {
            if (
              el.id.includes('netlify') || 
              el.className.includes('netlify') || 
              (el.src && el.src.includes('netlify'))
            ) {
              el.remove(); // Nhổ tận gốc khỏi cây thư mục HTML
            }
          });
        };

        // Chạy lần đầu tiên ngay khi tải cấu trúc xong
        killNetlify();

        // Thiết lập bộ giám sát (MutationObserver) liên tục theo dõi trang web để diệt tận gốc nếu Netlify tự tiêm vào sau đó
        const observer = new MutationObserver((mutations) => {
          killNetlify();
        });

        observer.observe(document.body, { childList: true, subtree: true });
      });
    </script>
    <!-- ============================================================== -->
</head>
<body>

    <!-- Khung chứa trình phát nhạc chính -->
    <div class="player-container">
        <h2 id="status-msg">Đang nạp danh sách nhạc từ hệ thống...</h2>
        
        <div class="player-wrapper">
            <h3 id="song-title">Chưa chọn bài hát</h3>
            
            <!-- Google Drive Player Preview Iframe -->
            <iframe id="audio-player" width="100%" height="120" frameborder="0" allow="autoplay" onload="handleIframeAutoNext()"></iframe>
        </div>

<div class="controls">
    <button class="control-btn-large">⏮</button>
    <button class="control-btn-large">⏭</button>
</div>


        <!-- Danh sách bài hát phân loại theo thư mục -->
        <div id="playlist-wrapper"></div>
    </div>

    <!-- THANH TÌM KIẾM GĂM ĐỈNH TÍCH HỢP NÚT HOME CHUYỂN ĐỘNG TRÌ HOÃN -->
    <div class="search-box outer-search">
        <input type="text" id="search-input" placeholder="Nhập tên bài hát cần tìm...">
        <button onclick="filterSongsDirect()" class="search-action-btn" title="Kích hoạt tìm kiếm bài hát">🔍 Tìm kiếm</button>

		<!-- Cấu hình nút Home trong file HTML của bạn -->
<button class="home-action-btn" onclick="handleHomeClickWithDelay()">🏠 Home</button>

    </div>

    <!-- BẢNG THỐNG KÊ TÍCH HỢP SÁT NHẬP NÚT XUẤT DANH SÁCH -->
     <!--    <div id="counter-dashboard" class="counter-dashboard" title="Click vùng chữ để Ẩn/Hiện số lượng; Click nút để Xuất tệp">
        <div class="dashboard-text" onclick="toggleSongCountDisplay()" style="cursor: pointer; user-select: none; display: flex; gap: 40px; flex: 1; justify-content: center; align-items: center;">
            <span>📂 Danh mục: <span id="total-folders">0</span></span>
            <span>🎵 Tổng số: <span id="total-songs">0</span></span>
        </div>
        <button onclick="exportPlaylistToTxt()" class="export-btn">📥 Xuất danh sách</button>
    </div>

    <!-- File thực thi logic cốt lõi -->
	<script>
document.addEventListener("DOMContentLoaded", function () {
    // Tìm thanh tìm kiếm trên giao diện
    const searchBox = document.querySelector(".search-box.outer-search");
    
    if (searchBox) {
        // Cập nhật danh sách lên 3 màu ngẫu nhiên
        const colors = ["bg-random-orange", "bg-random-blue", "bg-random-red"];
        
        // Tỷ lệ xúc xắc chia đều cho cả 3 màu (khoảng 33.3% mỗi màu)
        const randomIndex = Math.floor(Math.random() * colors.length);
        
        // Bơm class màu ngẫu nhiên vào giao diện
        searchBox.classList.add(colors[randomIndex]);
    }
});

	</script>
    <script src="playlist.js"></script>
</body>
</html>
